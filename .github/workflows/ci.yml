name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        name: [check, Playwright browser regression]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Full quality gate (same as local)
        if: matrix.name == 'check'
        run: pnpm run check
      - name: Build production UI and API for Playwright
        if: matrix.name == 'Playwright browser regression'
        run: pnpm build
      - name: Install Chromium for browser regression
        if: matrix.name == 'Playwright browser regression'
        run: |
          pnpm exec playwright install --with-deps chromium
          command -v ffmpeg && command -v ffprobe || sudo apt-get install -y ffmpeg
      - name: Browser regression with simulated model responses
        if: matrix.name == 'Playwright browser regression'
        run: pnpm test:browser
      - name: Gitleaks
        if: matrix.name == 'check' && (success() || failure())
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" | tar -xz -C /tmp
          /tmp/gitleaks detect --no-git --redact --config tools/configs/gitleaks.toml --source . --exit-code 1
