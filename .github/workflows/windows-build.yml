name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Prepare Rust
        run: rustup default stable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Inject production keys and environment
        shell: bash
        run: |
          cat << 'EOF' > .env.production
          DATABASE_URL="file:./dev.db"
          WANBANG_API_KEY="${{ secrets.WANBANG_API_KEY || 't3661731514' }}"
          WANBANG_API_SECRET="${{ secrets.WANBANG_API_SECRET || 'jz123456' }}"
          EXTERNAL_SCRAPER_ID="${{ secrets.EXTERNAL_SCRAPER_ID || '202037331' }}"
          EXTERNAL_SCRAPER_SECRET="${{ secrets.EXTERNAL_SCRAPER_SECRET || '32843381450B00510784B97CBD53A7CDCD70844F87652F97FE' }}"
          AI_DRAWING_BASE_URL="${{ secrets.AI_DRAWING_BASE_URL || 'https://ai.comfly.org' }}"
          AI_DRAWING_API_KEY="${{ secrets.AI_DRAWING_API_KEY || 'sk-zPD0Umv6ccqJjGoCZ1HJPpFD1wDqU5g66jsDEsj4K86dtXnZ' }}"
          EOF
          echo "Production keys injected successfully."
      - name: Build Windows EXE installer
        # beforeBuildCommand builds frontend, Windows sidecar, embedded production keys and clean template DB.
        run: pnpm exec tauri build --config desktop/tauri.conf.json --bundles nsis
      - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: beike-windows-x64-installer
          path: desktop/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
