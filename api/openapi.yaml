      responses:
        '200':
          description: 新版每套脚本包含单条视频交付模式及自动素材计划，旧请求兼容
          content:
            application/json:
              schema:
                type: object
                required: [success, scripts]
                properties:
                  success:
                    type: boolean
                  scripts:
                    type: array
                    items:
                      $ref: '#/components/schemas/VideoSalesScript'
