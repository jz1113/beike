              $ref: '#/components/schemas/VideoSalesSelectRequest'
      responses:
        '200':
          description: 只能选取模型实际查看过且在允许集合内的商品图片
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  assignments:
                    type: array
                    items:
                      type: object
                      required: [shotId, imageIndex, reason]
                      properties:
                        shotId:
                          type: integer
                        imageIndex:
                          type: integer
