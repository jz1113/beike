components:
  schemas:
    TextModelRoute:
      type: object
      description: 文本及图片理解模型路由；模型级显式协议优先，auto按真实上游模型识别Gemini或Anthropic原生协议，不改变渠道地址与密钥，也不自动回退协议。
      properties:
        model:
          type: string
          maxLength: 200
        textProtocol:
          type: string
          enum: [auto, openai, gemini, anthropic]
          default: auto
        customBaseUrl:
          type: string
          maxLength: 2048
        customApiKey:
          type: string
          maxLength: 4096
    AssistantTurnStartRequest:
      allOf:
        - $ref: '#/components/schemas/TextModelRoute'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              minItems: 1
              maxItems: 500
              items:
                type: object
                required: [role, content]
                properties:
                  role:
                    type: string
                    enum: [user, assistant, system]
                  content:
                    type: string
                    maxLength: 100000
                additionalProperties: true
            reasoningEffort:
              type: string
              enum: [auto, low, medium, high, xhigh]
              default: medium
          additionalProperties: true
    VideoSalesCatalogImage:
      type: object
      required: [index, url, role]
      properties:
        index:
          type: integer
          minimum: 0
        url:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
    VideoSalesWorkflowRequest:
      type: object
      description: workflowVersion为3时imageCatalog与eligibleImageIndexes必填，保留原始编号，仅处理允许集合
      properties:
        workflowVersion:
          type: integer
          enum: [3]
        imageCatalog:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: '#/components/schemas/VideoSalesCatalogImage'
        eligibleImageIndexes:
          type: array
          minItems: 1
          maxItems: 40
          uniqueItems: true
          items:
            type: integer
            minimum: 0
        selectedColor:
          type: string
          maxLength: 200
        model:
          type: string
        customBaseUrl:
          type: string
        customApiKey:
          type: string
        textProtocol:
          type: string
          enum: [auto, openai, gemini, anthropic]
          default: auto
      oneOf:
        - not:
            required: [workflowVersion]
        - required: [workflowVersion, imageCatalog, eligibleImageIndexes]
    VideoSalesAnalyzeRequest:
      allOf:
        - $ref: '#/components/schemas/VideoSalesWorkflowRequest'
        - type: object
          properties:
            imageUrls:
              type: array
              maxItems: 40
              items:
                type: string
            productName:
              type: string
            brand:
              type: string
            priceRange:
              type: string
            productDescription:
              type: string
              maxLength: 4000
            category:
              type: string
    VideoSalesAspectRatio:
      type: string
      enum: ['9:16', '16:9', '3:4', '4:3', '1:1', '21:9']
    VideoSalesScriptRequest:
      allOf:
        - $ref: '#/components/schemas/VideoSalesWorkflowRequest'
        - type: object
          required: [productName]
          properties:
            productName:
              type: string
              minLength: 1
              maxLength: 100
            category:
              type: string
              enum: [beauty, food, home, fashion, tech, other]
            productDescription:
              type: string
              maxLength: 2000
            productAnalysis:
              type: string
              maxLength: 4000
            productImages:
              type: array
              maxItems: 10
              items:
                type: string
            targetDuration:
              type: integer
              minimum: 10
              maximum: 120
            aspectRatio:
              $ref: '#/components/schemas/VideoSalesAspectRatio'
            priceRange:
              type: string
            brand:
              type: string
            targetAudience:
              type: string
            videoMode:
              type: string
              enum: [product_closeup, graphic_montage, scene_demo, live_presenter]
            platforms:
              type: array
              items:
                type: string
            templateId:
              type: string
            characterId:
              type: string
            fashionReferences:
              type: object
              required: [person, face, scene]
              properties:
                person:
                  type: boolean
                face:
                  type: boolean
                scene:
                  type: boolean
          oneOf:
            - not:
                required: [workflowVersion]
            - required: [workflowVersion, targetDuration, aspectRatio]
    VideoSalesPlannedAsset:
      type: object
      description: 按需1至4张，依赖只能指向前序素材；衣服上身图usesProduct必须为true
      required: [id, kind, label, prompt, required]
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [person, face, scene, keyframe]
        label:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
        required:
          type: boolean
        referenceAssetIds:
          type: array
          uniqueItems: true
          items:
            type: string
        usesProduct:
          type: boolean
    VideoSalesShot:
      type: object
      required: [shotId]
      properties:
        shotId:
          type: integer
          minimum: 1
        type:
          type: string
        duration:
          type: integer
          minimum: 1
        description:
          type: string
        camera:
          type: string
        voiceover:
          type: string
        prompt:
          type: string
        imageIndex:
          type: integer
          minimum: 0
        visualSource:
          type: string
        transition:
          type: string
        selectionReason:
          type: string
    VideoSalesScript:
      type: object
      description: 新版deliveryMode和assets必有，时长必须精确匹配请求，旧版返回结构保留
      required: [id, title, totalDuration, shots]
      properties:
        id:
          type: string
        title:
          type: string
        beat:
          type: string
        deliveryMode:
          type: string
          enum: [single]
        assets:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/VideoSalesPlannedAsset'
        totalDuration:
          type: integer
        shots:
          type: array
          items:
            $ref: '#/components/schemas/VideoSalesShot'
        seo:
          type: object
          additionalProperties: true
        fullPrompt:
          type: string
    VideoSalesSelectRequest:
      allOf:
        - $ref: '#/components/schemas/VideoSalesWorkflowRequest'
        - type: object
          required: [shots, imageCatalog]
          properties:
            shots:
              type: array
              minItems: 1
              maxItems: 40
              items:
                $ref: '#/components/schemas/VideoSalesShot'
    VideoSalesActualReference:
      type: object
      required: [id, kind, label, url]
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [product, person, face, scene, keyframe]
        label:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
    VideoSalesFinalizeRequest:
      allOf:
        - $ref: '#/components/schemas/VideoSalesWorkflowRequest'
        - type: object
          required: [shots, imageCatalog]
          properties:
            operation:
              type: string
              enum: [validate-assets, finalize]
            shots:
              type: array
              minItems: 1
              maxItems: 40
              items:
                allOf:
                  - $ref: '#/components/schemas/VideoSalesShot'
                  - type: object
                    required: [imageIndex]
            actualReferences:
              type: array
              minItems: 1
              maxItems: 44
              items:
                $ref: '#/components/schemas/VideoSalesActualReference'
            assets:
              type: array
              minItems: 1
              maxItems: 4
              items:
                $ref: '#/components/schemas/VideoSalesPlannedAsset'
            targetDuration:
              type: integer
              minimum: 10
              maximum: 120
            aspectRatio:
              $ref: '#/components/schemas/VideoSalesAspectRatio'
            videoModel:
              type: string
            videoRefMode:
              type: string
            videoResolution:
              type: string
            productAnalysis:
              type: string
              maxLength: 8000
            category:
              type: string
              enum: [beauty, food, home, fashion, tech, other]
            referenceOrder:
              type: array
              maxItems: 4
              items:
                type: object
                required: [slot, label, url]
                properties:
                  slot:
                    type: string
                    enum: [person, face, garment, scene]
                  label:
                    type: string
                  url:
                    type: string
                  imageIndex:
                    type: integer
                    minimum: 0
          oneOf:
            - not:
                anyOf:
                  - required: [workflowVersion]
                  - required: [operation]
            - required: [workflowVersion, operation, actualReferences]
              properties:
                operation:
                  enum: [validate-assets]
            - required: [workflowVersion, operation, actualReferences, targetDuration, aspectRatio]
              properties:
                operation:
                  enum: [finalize]
    VideoSalesAssetValidation:
      type: object
      required: [id, status, reason]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [passed, conflict, uncertain]
        reason:
          type: string
          minLength: 1
    VideoSalesFinalizeResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        model:
          type: string
        validations:
          type: array
          items:
            $ref: '#/components/schemas/VideoSalesAssetValidation'
        fullPrompt:
          type: string
        prompts:
          type: array
          items:
            type: object
            required: [shotId, prompt]
            properties:
              shotId:
                type: integer
              prompt:
                type: string
              imagePrompt:
                type: string
        personImagePrompt:
          type: string
        sceneImagePrompt:
          type: string
    CollectVariantMetadata:
      type: object
      required: [version, variants]
      properties:
        version:
          type: integer
          enum: [1]
        variants:
          type: array
          items:
            type: object
            required: [id, label, skuIds, imageUrls]
            properties:
              id:
                type: string
              label:
                type: string
              color:
                type: string
              skuIds:
                type: array
                items:
                  type: string
              imageUrls:
                type: array
                items:
                  type: string
        requestedSkuId:
          type: string
        selectedVariantId:
          type: string
