packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@vgpu/adapter-node': true
  webgpu: true
  sharp: true
  '@ffmpeg-installer/darwin-arm64': set this to true or false
  simple-git-hooks: set this to true or false

# Resolve internal @beike packages from this workspace.
linkWorkspacePackages: true
