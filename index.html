<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="贝壳云图 · 新一代电商全流程 AI 视觉创作工作台，支持爆款买家秀复刻、原创分镜生成与多模态智能助理" />
    <meta name="theme-color" content="#FAFAFC" />
    <!--
      Content Security Policy
      - 仅放行同源脚本/样式
      - 图片允许 data/blob/https/http(127.0.0.1/localhost)
      - connect 允许 http(127.0.0.1/localhost) 走本地 sidecar，https 走公网 API
      - 不允许 object/base-uri 注入
      桌面端 Tauri 仍由 tauri.conf.json 的 csp 字段控制；此处仅作浏览器层兜底
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://127.0.0.1:* http://localhost:*; media-src 'self' data: blob: https: http://127.0.0.1:* http://localhost:*; connect-src 'self' blob: data: http://127.0.0.1:* http://localhost:* https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />
    <title>贝壳云图</title>
    <link rel="icon" type="image/png" href="/app_logo.png?v=3" />
    <link rel="shortcut icon" type="image/png" href="/app_logo.png?v=3" />
    <link rel="apple-touch-icon" href="/app_logo.png?v=3" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
