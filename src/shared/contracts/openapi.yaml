components:
  schemas:
    CategoryLearningNote:
      type: object
      required: [id, kind, content, createdAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [prefer, avoid]
        content:
          type: string
        createdAt:
          type: string
    CategoryLearningEntry:
      type: object
      required: [groupId, title, state, reason, rules, conditions, avoid, model, createdAt]
      properties:
        groupId:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [pending, learned, rejected, holdout]
        reason:
          type: string
        rules:
          type: array
          items:
            type: string
        conditions:
          type: array
          items:
            type: string
        avoid:
          type: array
          items:
            type: string
        model:
          type: string
        createdAt:
          type: string
    CategoryLearningMemory:
      type: object
      required: [entries, notes, learned, pending, rejected, holdout, fingerprint]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CategoryLearningEntry'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/CategoryLearningNote'
        learned:
          type: integer
        pending:
          type: integer
        rejected:
          type: integer
        holdout:
          type: integer
        fingerprint:
          type: string
    TextModelRoute:
      type: object
      description: 文本及图片理解模型路由；模型级显式协议优先，auto按真实上游模型识别Gemini或Anthropic原生协议，不改变渠道地址与密钥，也不自动回退协议。
      properties:
        model:
          type: string
          maxLength: 200
        textProtocol:
          type: string
          enum: [auto, openai, gemini, anthropic]
          default: auto
        customBaseUrl:
          type: string
          maxLength: 2048
        customApiKey:
          type: string
          maxLength: 4096
    AssistantTurnStartRequest:
      allOf:
        - $ref: '#/components/schemas/TextModelRoute'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              minItems: 1
              maxItems: 500
              items:
                type: object
                required: [role, content]
                properties:
                  role:
                    type: string
                    enum: [user, assistant, system]
                  content:
                    type: string
                    maxLength: 100000
                additionalProperties: true
            reasoningEffort:
              type: string
              enum: [auto, low, medium, high, xhigh, max]
              default: medium
          additionalProperties: true
    VideoSalesCatalogImage:
      type: object
      required: [index, url, role]
      properties:
        index:
          type: integer
          minimum: 0
        url:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
    VideoSalesWorkflowRequest:
      type: "object"
      required:
        - "workflowVersion"
        - "imageCatalog"
        - "eligibleImageIndexes"
      properties:
        workflowVersion:
          type: "integer"
          enum:
            - 3
        imageCatalog:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoSalesCatalogImage"
          minItems: 1
          maxItems: 40
        eligibleImageIndexes:
          type: "array"
          items:
            type: "integer"
            minimum: 0
          minItems: 1
          maxItems: 40
          uniqueItems: true
        selectedColor:
          type: "string"
          maxLength: 200
        model:
          type: "string"
        customBaseUrl:
          type: "string"
        customApiKey:
          type: "string"
        textProtocol:
          type: "string"
          enum:
            - "auto"
            - "openai"
            - "gemini"
            - "anthropic"
          default: "auto"
      description: "仅接受当前流程；保留商品目录原始编号，仅处理允许集合"
    VideoSalesAnalyzeRequest:
      type: "object"
      required:
        - "workflowVersion"
        - "imageCatalog"
        - "eligibleImageIndexes"
        - "productName"
        - "category"
      properties:
        workflowVersion:
          type: "integer"
          enum:
            - 3
        imageCatalog:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoSalesCatalogImage"
          minItems: 1
          maxItems: 40
        eligibleImageIndexes:
          type: "array"
          items:
            type: "integer"
            minimum: 0
          minItems: 1
          maxItems: 40
          uniqueItems: true
        selectedColor:
          type: "string"
          maxLength: 200
        model:
          type: "string"
        customBaseUrl:
          type: "string"
        customApiKey:
          type: "string"
        textProtocol:
          type: "string"
          enum:
            - "auto"
            - "openai"
            - "gemini"
            - "anthropic"
          default: "auto"
        productName:
          type: "string"
          minLength: 1
        brand:
          type: "string"
        category:
          type: "string"
          enum:
            - "fashion"
        productDescription:
          type: "string"
          maxLength: 4000
      additionalProperties: false
    VideoSalesAspectRatio:
      type: "string"
      enum:
        - "9:16"
        - "16:9"
        - "3:4"
        - "1:1"
    VideoSalesScriptRequest:
      type: "object"
      required:
        - "workflowVersion"
        - "imageCatalog"
        - "eligibleImageIndexes"
        - "productName"
        - "category"
        - "targetDuration"
        - "aspectRatio"
      properties:
        workflowVersion:
          type: "integer"
          enum:
            - 3
        imageCatalog:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoSalesCatalogImage"
          minItems: 1
          maxItems: 40
        eligibleImageIndexes:
          type: "array"
          items:
            type: "integer"
            minimum: 0
          minItems: 1
          maxItems: 40
          uniqueItems: true
        selectedColor:
          type: "string"
          maxLength: 200
        model:
          type: "string"
        customBaseUrl:
          type: "string"
        customApiKey:
          type: "string"
        textProtocol:
          type: "string"
          enum:
            - "auto"
            - "openai"
            - "gemini"
            - "anthropic"
          default: "auto"
        productName:
          type: "string"
          minLength: 1
          maxLength: 100
        category:
          type: "string"
          enum:
            - "fashion"
        brand:
          type: "string"
        productDescription:
          type: "string"
          maxLength: 4000
        productAnalysis:
          type: "string"
          maxLength: 8000
        targetAudience:
          type: "string"
          maxLength: 200
        targetDuration:
          type: "integer"
          minimum: 10
          maximum: 120
        aspectRatio:
          $ref: "#/components/schemas/VideoSalesAspectRatio"
        videoMode:
          type: "string"
          enum:
            - "product_closeup"
            - "graphic_montage"
            - "scene_demo"
            - "live_presenter"
          default: "live_presenter"
      additionalProperties: false
    VideoSalesPlannedAsset:
      type: "object"
      required:
        - "id"
        - "kind"
        - "label"
        - "prompt"
        - "required"
      properties:
        id:
          type: "string"
          minLength: 1
        kind:
          type: "string"
          enum:
            - "person"
            - "face"
            - "scene"
            - "keyframe"
        label:
          type: "string"
          minLength: 1
        prompt:
          type: "string"
          minLength: 1
        required:
          type: "boolean"
        referenceAssetIds:
          type: "array"
          items:
            type: "string"
            minLength: 1
          uniqueItems: true
        usesProduct:
          type: "boolean"
        productImageIndexes:
          type: "array"
          items:
            type: "integer"
            minimum: 0
          uniqueItems: true
          description: "使用商品的素材必须明确提供非空原始编号；旧计划缺失时需更新脚本"
      description: "按需 1 至 4 张，依赖只能指向前序素材"
      oneOf:
        -
          required:
            - "usesProduct"
            - "productImageIndexes"
          properties:
            usesProduct:
              enum:
                - true
            productImageIndexes:
              minItems: 1
        -
          properties:
            usesProduct:
              enum:
                - false
            productImageIndexes:
              maxItems: 0
    VideoSalesShot:
      type: "object"
      required:
        - "shotId"
        - "speechMode"
        - "voiceover"
      properties:
        shotId:
          type: "integer"
          minimum: 1
        type:
          type: "string"
        duration:
          type: "integer"
          minimum: 1
        description:
          type: "string"
        camera:
          type: "string"
        speechMode:
          type: "string"
          enum:
            - "on_camera"
            - "voiceover"
        voiceover:
          type: "string"
          minLength: 1
        prompt:
          type: "string"
        imageIndex:
          type: "integer"
          minimum: 0
        visualSource:
          type: "string"
          enum:
            - "product_image"
            - "ai_generate"
        transition:
          type: "string"
          enum:
            - "direct_concat"
        selectionReason:
          type: "string"
    VideoSalesScript:
      type: "object"
      required:
        - "id"
        - "title"
        - "totalDuration"
        - "shots"
        - "deliveryMode"
        - "assets"
      properties:
        id:
          type: "string"
        title:
          type: "string"
        beat:
          type: "string"
          enum:
            - "unbox"
            - "lifestyle"
            - "accessory"
        deliveryMode:
          type: "string"
          enum:
            - "single"
        assets:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoSalesPlannedAsset"
          minItems: 1
          maxItems: 4
        totalDuration:
          type: "integer"
        shots:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoSalesShot"
          minItems: 1
          maxItems: 40
        seo:
          type: "object"
          additionalProperties: true
        fullPrompt:
          type: "string"
      description: "仅当前服饰脚本，分镜为整段时间轴，总时长精确匹配请求"
    VideoSalesSelectRequest:
      type: "object"
      required:
        - "workflowVersion"
        - "imageCatalog"
        - "eligibleImageIndexes"
        - "shots"
      properties:
        workflowVersion:
          type: "integer"
          enum:
            - 3
        imageCatalog:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoSalesCatalogImage"
          minItems: 1
          maxItems: 40
        eligibleImageIndexes:
          type: "array"
          items:
            type: "integer"
            minimum: 0
          minItems: 1
          maxItems: 40
          uniqueItems: true
        selectedColor:
          type: "string"
          maxLength: 200
        model:
          type: "string"
        customBaseUrl:
          type: "string"
        customApiKey:
          type: "string"
        textProtocol:
          type: "string"
          enum:
            - "auto"
            - "openai"
            - "gemini"
            - "anthropic"
          default: "auto"
        shots:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoSalesShot"
          minItems: 1
          maxItems: 40
      additionalProperties: false
    VideoSalesActualReference:
      type: "object"
      required:
        - "id"
        - "kind"
        - "label"
        - "url"
      properties:
        id:
          type: "string"
          minLength: 1
        kind:
          type: "string"
          enum:
            - "product"
            - "person"
            - "face"
            - "scene"
            - "keyframe"
        label:
          type: "string"
          minLength: 1
        url:
          type: "string"
          minLength: 1
    VideoSalesFinalizeRequest:
      type: "object"
      required:
        - "workflowVersion"
        - "imageCatalog"
        - "eligibleImageIndexes"
        - "operation"
        - "category"
        - "shots"
        - "actualReferences"
        - "assets"
        - "targetDuration"
        - "aspectRatio"
      properties:
        workflowVersion:
          type: "integer"
          enum:
            - 3
        imageCatalog:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoSalesCatalogImage"
          minItems: 1
          maxItems: 40
        eligibleImageIndexes:
          type: "array"
          items:
            type: "integer"
            minimum: 0
          minItems: 1
          maxItems: 40
          uniqueItems: true
        selectedColor:
          type: "string"
          maxLength: 200
        model:
          type: "string"
        customBaseUrl:
          type: "string"
        customApiKey:
          type: "string"
        textProtocol:
          type: "string"
          enum:
            - "auto"
            - "openai"
            - "gemini"
            - "anthropic"
          default: "auto"
        operation:
          type: "string"
          enum:
            - "finalize"
        category:
          type: "string"
          enum:
            - "fashion"
        shots:
          type: "array"
          items:
            allOf:
              -
                $ref: "#/components/schemas/VideoSalesShot"
              -
                required:
                  - "imageIndex"
                  - "duration"
          minItems: 1
          maxItems: 40
        actualReferences:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoSalesActualReference"
          minItems: 1
          maxItems: 44
        assets:
          type: "array"
          items:
            $ref: "#/components/schemas/VideoSalesPlannedAsset"
          minItems: 1
          maxItems: 4
        targetDuration:
          type: "integer"
          minimum: 10
          maximum: 120
        aspectRatio:
          $ref: "#/components/schemas/VideoSalesAspectRatio"
        videoModel:
          type: "string"
        videoRefMode:
          type: "string"
        videoResolution:
          type: "string"
        productAnalysis:
          type: "string"
          maxLength: 8000
      additionalProperties: false
    VideoSalesFinalizeResponse:
      type: "object"
      required:
        - "success"
        - "fullPrompt"
        - "prompts"
      properties:
        success:
          type: "boolean"
          enum:
            - true
        model:
          type: "string"
        usage:
          type: "object"
          additionalProperties: true
        fullPrompt:
          type: "string"
          minLength: 1
        prompts:
          type: "array"
          items:
            type: "object"
            required:
              - "shotId"
              - "prompt"
            properties:
              shotId:
                type: "integer"
                minimum: 1
              prompt:
                type: "string"
                minLength: 1
          minItems: 1
    CollectVariantMetadata:
      type: object
      required: [version, variants]
      properties:
        version:
          type: integer
          enum: [1]
        variants:
          type: array
          items:
            type: object
            required: [id, label, skuIds, imageUrls]
            properties:
              id:
                type: string
              label:
                type: string
              color:
                type: string
              skuIds:
                type: array
                items:
                  type: string
              imageUrls:
                type: array
                items:
                  type: string
        requestedSkuId:
          type: string
        selectedVariantId:
          type: string
