  /api/catalog/category-skills:
    get:
      operationId: get_api_catalog_category_skills
      description: 读取当前工作区二级类目的样本、观察记忆、经验、技能版本及验证进度。
      parameters:
        - in: query
          name: folderId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 类目智能体状态；原图与逐镜长文本不在状态轮询中返回。
          content:
            application/json:
              schema:
                type: object
                required: [success, memory, pendingSamples, needsConsolidation, attemptFingerprint]
                additionalProperties: true
                properties:
                  success:
                    type: boolean
                  memory:
                    $ref: '#/components/schemas/CategoryLearningMemory'
                  pendingSamples:
                    type: integer
                  needsConsolidation:
                    type: boolean
                  attemptFingerprint:
                    type: string
    post:
      operationId: post_api_catalog_category_skills
      description: 逐组观察、整理候选、手动编辑新候选、维护经验及切换版本；学习请求支持后台执行，编辑不覆盖已有版本，学习请求不自动重放失败调用。
      parameters:
        - in: query
          name: action
          required: true
          schema:
            type: string
            enum: [learn, observe, consolidate, edit, remember, forget, retry-sample, configure, trial, baseline, publish, activate, rollback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folderId]
              additionalProperties: true
              properties:
                folderId:
                  type: string
                revision:
                  type: integer
                  description: 非学习操作必须提交当前状态版本，防止覆盖并发修改。
                maxNewSamples:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 5
                force:
                  type: boolean
                background:
                  type: boolean
                  description: 学习操作登记后立即返回，模型调用在服务端继续执行。
                kind:
                  type: string
                  enum: [prefer, avoid]
                content:
                  type: string
                  maxLength: 500
                id:
                  type: string
                versionId:
                  type: string
                promptSnippet:
                  type: string
                  minLength: 1
                  maxLength: 16000
                  description: edit 操作的完整技能正文；versionId 指定来源版本。
                summary:
                  type: string
                  maxLength: 200
                  description: edit 操作的修改说明。
      responses:
        '200':
          description: 操作成功；学习操作包含 observed 或 candidate 阶段、已读组数和剩余组数。
        '202':
          description: 学习任务已登记，服务端将在后台继续执行；通过 GET 轮询 scope.runningToken、progress 和 error。
        '409':
          description: 状态冲突、相同资料已尝试或候选尚未通过实际成图对照。
