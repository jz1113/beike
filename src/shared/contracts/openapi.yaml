      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, imageUrl]
              properties:
                kind:
                  type: string
                  enum: [persona, scene]
                imageUrl:
                  type: string
                  minLength: 1
                  description: 当前工作区存储路径、公网图片 URL 或图片 data URL
      responses:
        '200':
          description: 按从左到右、从上到下顺序裁切的九张 JPG；重试复用同一输出路径
          content:
            application/json:
              schema:
                type: object
                required: [success, images]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  images:
                    type: array
                    minItems: 9
                    maxItems: 9
                    items:
                      type: object
                      required: [view, url]
                      properties:
                        view:
                          type: string
                          enum: [face, front, side, threeQuarterLeft, threeQuarterRight, back, sideRight, upperBody, backThreeQuarter, left, right, reverse, frontWide, leftWide, rightWide, reverseLeft, reverseRight, detail]
                        url:
                          type: string
        '400':
          description: 参数或原图读取失败；读取失败包含 image_read_failed 错误码
