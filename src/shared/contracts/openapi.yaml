            type: string
            enum: [respond-async]
          description: 经任务中心接管执行，未设置时使用同步响应
      responses:
        '202':
          description: 返回已持久化的 job 与编号，可从 /api/sales/media-jobs 查询
        '200':
          description: 视频提交或幂等复用回执；诊断仅证明发送内容，不证明上游采用了参考素材
          content:
