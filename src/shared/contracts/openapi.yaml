      operationId: post_api_generate_video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                context_ir_enabled:
                  type: boolean
                  description: 秘塔 H3 的 IR Context 开关；缺省开启，显式值优先于渠道控制台的全局开关，其他渠道不转发
                voice_ids:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                  description: Grok 1.5 视频生成使用的官方预置音色标识，转发为 reference_audios.voice_id；不接受音频文件，编辑与延长模式不支持
      parameters:
        - in: header
          name: Prefer
