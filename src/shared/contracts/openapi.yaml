      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoSalesFinalizeRequest'
      responses:
        '200':
          description: 仅 finalize 返回整段及分段视频提示词；素材由用户人工确认
          content:
