              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  job:
                    $ref: '#/components/schemas/SalesAssetViewJob'
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalesAssetViewJob'
