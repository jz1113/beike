components:
  responses:
    VideoDownloadError:
      description: 请求、授权或运行环境不允许此操作；error 含可展示的原因
      content:
        application/json:
          schema:
            type: object
            required: [success, error]
            properties:
              success:
                type: boolean
                enum: [false]
              error:
                type: string
  schemas:
    SalesPrompt:
      type: object
      required: [id, title, description, prompt, defaultPrompt, version, customized]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        prompt:
          type: string
        defaultPrompt:
          type: string
        version:
          type: string
        customized:
          type: boolean
    VideoDownloadRequest:
      type: object
      required: [directory, directoryToken, items]
      properties:
        directory:
          type: string
        directoryToken:
          type: string
        concurrency:
          type: integer
          enum: [0, 100]
          default: 100
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [filename, url]
            properties:
              filename:
                type: string
                description: 单个安全视频文件名；同名已存在时拒绝覆盖
              url:
                type: string
                description: 由后端视频代理安全策略校验的远程 URL
    VideoDownloadSnapshot:
      type: object
      required: [jobId, directory, running, items]
      properties:
        jobId:
          type: string
        directory:
          type: string
        running:
          type: boolean
        items:
          type: array
          items:
            type: object
            required: [filename, url, status]
            properties:
              filename:
                type: string
              url:
                type: string
              status:
                type: string
                enum: [pending, running, success, failed]
              error:
                type: string
    CategoryLearningNote:
      type: object
      required: [id, kind, content, createdAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [prefer, avoid]
        content:
          type: string
        createdAt:
          type: string
    CategoryLearningEntry:
      type: object
      required: [groupId, title, state, reason, rules, conditions, avoid, model, createdAt]
      properties:
        groupId:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [pending, learned, rejected, holdout]
        reason:
          type: string
        rules:
          type: array
          items:
            type: string
        conditions:
          type: array
          items:
            type: string
        avoid:
          type: array
          items:
            type: string
        model:
          type: string
        createdAt:
          type: string
    CategoryLearningMemory:
      type: object
      required: [entries, notes, learned, pending, rejected, holdout, fingerprint]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CategoryLearningEntry'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/CategoryLearningNote'
        learned:
          type: integer
        pending:
          type: integer
        rejected:
          type: integer
        holdout:
          type: integer
        fingerprint:
          type: string
    TextModelRoute:
      type: object
      description: 文本及图片理解模型路由；模型级显式协议优先，auto按真实上游模型识别Gemini或Anthropic原生协议，不改变渠道地址与密钥，也不自动回退协议。
      properties:
        model:
          type: string
          maxLength: 200
        textProtocol:
          type: string
          enum: [auto, openai, gemini, anthropic]
          default: auto
        customBaseUrl:
          type: string
          maxLength: 2048
        customApiKey:
          type: string
          maxLength: 4096
    AssistantTurnStartRequest:
      allOf:
        - $ref: '#/components/schemas/TextModelRoute'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              minItems: 1
              maxItems: 500
              items:
                type: object
                required: [role, content]
                properties:
                  role:
                    type: string
                    enum: [user, assistant, system]
                  content:
                    type: string
                    maxLength: 100000
                additionalProperties: true
            reasoningEffort:
              type: string
              enum: [auto, low, medium, high, xhigh, max]
              default: medium
          additionalProperties: true
    CollectVariantMetadata:
      type: object
      required: [version, variants]
      properties:
        version:
          type: integer
          enum: [1]
        variants:
          type: array
          items:
            type: object
            required: [id, label, skuIds, imageUrls]
            properties:
              id:
                type: string
              label:
                type: string
              color:
                type: string
              skuIds:
                type: array
                items:
                  type: string
              imageUrls:
                type: array
                items:
                  type: string
        requestedSkuId:
          type: string
        selectedVariantId:
          type: string
    SalesSummaryImage:
      type: object
      required: [index, url]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 99999
        url:
          type: string
          minLength: 1
          maxLength: 8192
    SalesSummaryRequest:
      type: object
      required: [productName, brand, facts, referenceImages, textImages, model]
      description: 去重后最多16张原图、合计20MiB；核对文字合计最多60000字。
      properties:
        productName:
          type: string
          maxLength: 2000
        brand:
          type: string
          maxLength: 500
        facts:
          type: string
          maxLength: 20000
        referenceImages:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/SalesSummaryImage'
        textImages:
          type: array
          maxItems: 16
          items:
            allOf:
              - $ref: '#/components/schemas/SalesSummaryImage'
              - type: object
                required: [text]
                properties:
                  text:
                    type: string
                    minLength: 1
                    maxLength: 40000
        model:
          type: string
          minLength: 1
          maxLength: 200
        textProtocol:
          type: string
          enum: [auto, openai, gemini, anthropic]
        customBaseUrl:
          type: string
          maxLength: 8192
        customApiKey:
          type: string
          maxLength: 8192
        apiFormat:
          type: string
          enum: [openai-responses]
        allowInsecureHttp:
          type: boolean
    SalesSummaryResult:
      type: object
      required: [summary, points, copy, conflicts, questions]
      properties:
        cautions:
          type: array
          maxItems: 6
          default: []
          description: 来自商品资料的关键使用与养护限制；补足已收录标签中的明确限制。
          items:
            type: string
            minLength: 1
            maxLength: 1000
        summary:
          type: string
          minLength: 1
          maxLength: 1000
        points:
          type: array
          maxItems: 6
          items:
            type: object
            required: [feature, benefit, expression, sources]
            properties:
              feature:
                type: string
                minLength: 1
                maxLength: 1000
              benefit:
                type: string
                minLength: 1
                maxLength: 1000
              expression:
                type: string
                minLength: 1
                maxLength: 1000
              sources:
                type: array
                minItems: 1
                maxItems: 16
                items:
                  type: string
        copy:
          type: string
          maxLength: 4000
        copyPointIndexes:
          type: array
          maxItems: 3
          uniqueItems: true
          default: []
          description: 成稿生成时参考的买点，使用 points 中从 1 开始的编号；旧结果默认空数组。
          items:
            type: integer
            minimum: 1
            maximum: 6
        conflicts:
          type: array
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 1000
        questions:
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 1000
    SalesOCRRequest:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
          minLength: 1
          maxLength: 8192
        force:
          type: boolean
          default: false
    SalesOCRResult:
      type: object
      required: [engine, width, height, text, lines, cached]
      properties:
        engine:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        text:
          type: string
          maxLength: 100000
        cached:
          type: boolean
        lines:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [box, text, confidence]
            properties:
              box:
                type: array
                minItems: 4
                maxItems: 4
                items:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    type: number
              text:
                type: string
              confidence:
                type: number
                minimum: 0
                maximum: 1
