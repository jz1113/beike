                  type: string
                  minLength: 1
                  maxLength: 200
                productName:
                  type: string
                  maxLength: 2000
                facts:
                  type: string
                  maxLength: 20000
                  description: 当前商品原始资料，不含生成的概括、买点或文案。
                sourceCopy:
                  type: string
                  maxLength: 10000
                  description: 待优化稿，不构成事实证据。
                reviewOnly:
                  type: boolean
                  default: false
                voiceMode:
                  type: string
                  enum: [speech, voiceover]
                duration:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 600
                targetCps:
                  type: number
                  minimum: 2
                  maximum: 4.6
                beats:
                  type: array
                  minItems: 1
                  maxItems: 24
                  items:
                    type: object
                    required: [index, start, end, action]
                    properties:
                      index:
                        type: integer
                        minimum: 0
                      start:
                        type: number
                        minimum: 0
                      end:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 600
                      action:
                        type: string
                        maxLength: 2000
                      expression:
                        type: string
                        maxLength: 600
                      transition:
                        type: string
                        maxLength: 400
                      spokenLine:
                        type: string
                        maxLength: 2000
                      subtitle:
                        type: string
                        maxLength: 1000
      responses:
        '200':
          description: 改写稿或原稿已通过本次语义验收
          content:
            application/json:
              schema:
                type: object
                required: [success, beats, model, promptVersion, reviewPromptVersion]
                properties:
                  success:
                    type: boolean
                    const: true
                  model:
                    type: string
                  promptVersion:
                    type: string
                    description: 本次写稿规则版本；reviewOnly 未执行写稿时为空。
                  reviewPromptVersion:
                    type: string
                    minLength: 1
                  beats:
                    type: array
                    minItems: 1
                    maxItems: 24
                    items:
                      type: object
                      required: [index, spokenLine, subtitle]
                      properties:
                        index:
                          type: integer
                          minimum: 0
                        spokenLine:
                          type: string
                        subtitle:
                          type: string
        '422':
          description: 手工原稿未通过基础或语义验收，保留原稿并返回具体问题。
        '502':
          description: 审稿失败、回执无效或三稿仍未通过，不返回成功稿与审核版本。临时审稿故障可携带 pendingReview，供下次 reviewOnly 原字续验；候选稿不表示审核通过。
          content:
            application/json:
              schema:
                type: object
                required: [success, error]
                properties:
                  success:
                    type: boolean
                    const: false
                  error:
                    type: string
                  code:
                    type: string
                  stage:
                    type: string
                  pendingReview:
                    type: object
                    required: [beats, promptVersion]
                    properties:
                      promptVersion:
                        type: string
                        minLength: 1
                      beats:
                        type: array
                        minItems: 1
                        maxItems: 24
                        items:
                          type: object
                          required: [index, spokenLine, subtitle]
                          properties:
                            index:
                              type: integer
                              minimum: 0
                            spokenLine:
                              type: string
                            subtitle:
                              type: string
