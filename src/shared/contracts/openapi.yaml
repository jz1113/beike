components:
  schemas:
    SalesPersonaVisualProfile:
      type: object
      required: [imageUrl, presence, temperament, gaze, expression, posture, limitations]
      properties:
        imageUrl:
          type: string
          maxLength: 8192
          description: 服务端绑定的本次原图地址
        presence:
          type: string
          enum: [full_presenter, silent_model, hands_only]
        temperament:
          type: string
          maxLength: 600
          description: 外观传达的视觉气质及其可见依据，不推断内在性格
        gaze:
          type: string
          maxLength: 600
        expression:
          type: string
          maxLength: 600
        posture:
          type: string
          maxLength: 600
        limitations:
          type: string
          maxLength: 600
          description: 裁切、遮挡及静态图的观察限制；不可见项留空，至少有一项可见观察
    SalesAssetCreation:
      type: object
      required: [referenceImageUrl]
      properties:
        referenceImageUrl:
          type: string
        prompt:
          type: string
        imageUrl:
          type: string
        promptModel:
          type: string
        imageModel:
          type: string
    SalesAssetUsageScope:
      type: object
      required: [workspaceId, channelId, mediaType, epoch]
      properties:
        workspaceId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        channelId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        mediaType:
          type: string
          enum: [vision, image]
        epoch:
          type: string
          minLength: 1
          maxLength: 160
    SalesAssetUsageReceipt:
      type: object
      required: [stage, modelId, success]
      properties:
        stage:
          type: string
          enum: [analysis, main, views]
        modelId:
          type: string
        taskId:
          type: string
        recordId:
          type: string
        success:
          type: boolean
        usage:
          type: object
          required: [promptTokens, completionTokens, totalTokens]
          properties:
            promptTokens:
              type: number
              minimum: 0
            completionTokens:
              type: number
              minimum: 0
            totalTokens:
              type: number
              minimum: 0
    SalesAssetViewJob:
      type: object
      required: [id, key, kind, assetId, model, status, error, images, createdAt, updatedAt]
      properties:
        id:
          type: string
        key:
          type: string
        kind:
          type: string
          enum: [persona, scene]
        assetId:
          type: string
        model:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [queued, analyzing, creating, generating, cropping, saving, completed, failed]
        error:
          type: string
        images:
          type: object
          additionalProperties:
            type: string
        creation:
          $ref: '#/components/schemas/SalesAssetCreation'
        usageScopes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SalesAssetUsageScope'
        usageReceipts:
          type: array
          items:
            $ref: '#/components/schemas/SalesAssetUsageReceipt'
        createdAt:
          type: string
        updatedAt:
          type: string
    VideoSubmissionResponse:
      type: object
      additionalProperties: true
      properties:
        submissionDiagnostics:
          $ref: '#/components/schemas/VideoSubmissionDiagnostics'
        diagnosticsSaved:
          type: boolean
          description: 本次诊断是否已成功持久化；false 不改变已受理任务的状态
    VideoSubmissionDiagnostics:
      type: object
      required: [version, model, family, audioReferenceCount, audioReferences, endpointAttempts, submissionOutcome, preparedAt]
      properties:
        version:
          type: integer
          enum: [1]
        model:
          type: string
          description: 实际提交给渠道的模型标识；渠道未返回的底层型号不可由此推断
        family:
          type: string
        generateAudio:
          type: boolean
          description: 实际请求明确提供的声音生成开关；缺省时不推断渠道默认值
        contextIrEnabled:
          type: boolean
          description: 秘塔 H3 实际出站的 IR Context 开关；其他渠道省略
        audioReferenceCount:
          type: integer
          minimum: 0
        audioReferences:
          type: array
          items:
            type: object
            required: [index, role, sourceType, referenceSha256]
            properties:
              index:
                type: integer
                minimum: 1
              role:
                type: string
              sourceType:
                type: string
                enum: [local, remote, asset, preset]
              voiceId:
                type: string
                description: 实际提交的 Grok 官方预置音色标识；文件音频引用省略
              sourceSha256:
                type: string
                description: 本地原始音频文件的 SHA-256，不保存路径或音频内容
              referenceSha256:
                type: string
                description: 实际提交引用字符串的 SHA-256，不保存签名链接
              sourceDurationSeconds:
                type: number
                minimum: 0
                description: 本地原始音频时长；仅记录本地样本处理，远程引用无元数据时省略
              submittedDurationSeconds:
                type: number
                minimum: 0
                description: 本地样本实际提交片段的时长；远程引用无元数据时省略
              trimmed:
                type: boolean
                description: 本地样本是否已按模型时长限制截取；未截取或远程引用无元数据时可省略
        endpoint:
          type: object
          required: [host, path]
          properties:
            host:
              type: string
            path:
              type: string
              description: 已剔除凭据、查询参数及敏感路径段
        endpointAttempts:
          type: integer
          minimum: 0
        submissionOutcome:
          type: string
          enum: [prepared, accepted, rejected, unknown]
        preparedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
    SalesPrompt:
      type: object
      required: [id, title, description, prompt, defaultPrompt, version, customized]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        prompt:
          type: string
        defaultPrompt:
          type: string
        version:
          type: string
        customized:
          type: boolean
    CategoryLearningNote:
      type: object
      required: [id, kind, content, createdAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [prefer, avoid]
        content:
          type: string
        createdAt:
          type: string
    CategoryLearningEntry:
      type: object
      required: [groupId, title, state, reason, rules, conditions, avoid, model, createdAt]
      properties:
        groupId:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [pending, learned, rejected, holdout]
        reason:
          type: string
        rules:
          type: array
          items:
            type: string
        conditions:
          type: array
          items:
            type: string
        avoid:
          type: array
          items:
            type: string
        model:
          type: string
        createdAt:
          type: string
    CategoryLearningMemory:
      type: object
      required: [entries, notes, learned, pending, rejected, holdout, fingerprint]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CategoryLearningEntry'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/CategoryLearningNote'
        learned:
          type: integer
        pending:
          type: integer
        rejected:
          type: integer
        holdout:
          type: integer
        fingerprint:
          type: string
    TextModelRoute:
      type: object
      description: 文本及图片理解模型路由；模型级显式协议优先，auto按真实上游模型识别Gemini或Anthropic原生协议，不改变渠道地址与密钥，也不自动回退协议。
      properties:
        model:
          type: string
          maxLength: 200
        textProtocol:
          type: string
          enum: [auto, openai, gemini, anthropic]
          default: auto
        customBaseUrl:
          type: string
          maxLength: 2048
        customApiKey:
          type: string
          maxLength: 4096
    AssistantTurnStartRequest:
      allOf:
        - $ref: '#/components/schemas/TextModelRoute'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              minItems: 1
              maxItems: 500
              items:
                type: object
                required: [role, content]
                properties:
                  role:
                    type: string
                    enum: [user, assistant, system]
                  content:
                    type: string
                    maxLength: 100000
                additionalProperties: true
            reasoningEffort:
              type: string
              enum: [auto, low, medium, high, xhigh, max]
              default: medium
          additionalProperties: true
    CollectVariantMetadata:
      type: object
      required: [version, variants]
      properties:
        version:
          type: integer
          enum: [1]
        variants:
          type: array
          items:
            type: object
            required: [id, label, skuIds, imageUrls]
            properties:
              id:
                type: string
              label:
                type: string
              color:
                type: string
              skuIds:
                type: array
                items:
                  type: string
              imageUrls:
                type: array
                items:
                  type: string
        requestedSkuId:
          type: string
        selectedVariantId:
          type: string
    SalesSummaryTextSource:
      type: object
      required: [index, text]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 99999
        text:
          type: string
          minLength: 1
          maxLength: 40000
    SalesSummaryRequest:
      type: object
      required: [textSources, model]
      description: 商品资料和 OCR 文字至少提供一种。OCR 单条最多 40000 字、合计最多 60000 字，来源编号不可重复。
      properties:
        productFacts:
          type: string
          maxLength: 20000
        textSources:
          type: array
          items:
            $ref: '#/components/schemas/SalesSummaryTextSource'
        model:
          type: string
          minLength: 1
          maxLength: 200
        textProtocol:
          type: string
          enum: [auto, openai, gemini, anthropic]
        customBaseUrl:
          type: string
          maxLength: 8192
        customApiKey:
          type: string
          maxLength: 8192
        apiFormat:
          type: string
          enum: [openai-responses]
        allowInsecureHttp:
          type: boolean
    SalesSummaryResult:
      type: object
      required: [summary, points, copy, conflicts, questions]
      properties:
        cautions:
          type: array
          maxItems: 6
          default: []
          description: 来自商品资料的关键使用与养护限制；补足已收录标签中的明确限制。
          items:
            type: string
            minLength: 1
            maxLength: 1000
        summary:
          type: string
          minLength: 1
          maxLength: 1000
        points:
          type: array
          maxItems: 6
          items:
            type: object
            required: [feature, benefit, expression, sources]
            properties:
              feature:
                type: string
                minLength: 1
                maxLength: 1000
              benefit:
                type: string
                minLength: 1
                maxLength: 1000
              expression:
                type: string
                minLength: 1
                maxLength: 1000
              sources:
                type: array
                minItems: 1
                maxItems: 16
                items:
                  type: string
        copy:
          type: string
          maxLength: 4000
        copyPointIndexes:
          type: array
          maxItems: 3
          uniqueItems: true
          default: []
          description: 成稿生成时参考的买点，使用 points 中从 1 开始的编号；旧结果默认空数组。
          items:
            type: integer
            minimum: 1
            maximum: 6
        conflicts:
          type: array
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 1000
        questions:
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 1000
    SalesVideoClipRequest:
      type: object
      additionalProperties: false
      required: [sourceUrl, endSec]
      properties:
        sourceUrl:
          type: string
          minLength: 1
          maxLength: 8192
        endSec:
          type: number
          minimum: 0.1
          maximum: 600
        maxDurationSec:
          type: number
          minimum: 0.1
          maximum: 600
          description: 所选模型的参考视频预算，必须不短于 endSec；仅在边界处省去未完整的一帧，保持播放速度
    SalesVideoClipResponse:
      type: object
      required: [success, url, startSec, endSec, durationSec]
      properties:
        success:
          type: boolean
          enum: [true]
        url:
          type: string
          pattern: '^/storage/'
        startSec:
          type: number
          enum: [0]
        endSec:
          type: number
          minimum: 0.1
          maximum: 600
        durationSec:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 600.1
    SalesOCRRequest:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
          minLength: 1
          maxLength: 8192
        force:
          type: boolean
          default: false
    SalesOCRResult:
      type: object
      required: [engine, width, height, text, lines, cached]
      properties:
        engine:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        text:
          type: string
          maxLength: 100000
        cached:
          type: boolean
        lines:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [box, text, confidence]
            properties:
              box:
                type: array
                minItems: 4
                maxItems: 4
                items:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    type: number
              text:
                type: string
              confidence:
                type: number
                minimum: 0
                maximum: 1
