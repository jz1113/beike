                  maxLength: 256
                kind:
                  type: string
                  enum: [persona, scene]
                assetId:
                  type: string
                data:
                  type: object
                  additionalProperties: true
                generation:
                  type: object
                  additionalProperties: true
                  properties:
                    assetCreation:
                      type: object
                      additionalProperties: true
                      required: [referenceImageUrl, analysisModel]
                      properties:
                        referenceImageUrl:
