      summary: 裁切人物一行四格或场景九宫格到当前工作区
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, imageUrl]
              properties:
                kind:
                  type: string
                  enum: [persona, scene]
                layout:
                  type: string
                  enum: [1x4, 3x3]
                  description: 新人物视角使用 1x4，省略时兼容已有九宫格
                whole:
                  type: boolean
                  description: 人物 1x4 横图以单张 sheet 保存，默认兼容历史裁切请求
                imageUrl:
                  type: string
                  minLength: 1
                  description: 当前工作区存储路径、公网图片 URL 或图片 data URL
      responses:
        '200':
          description: 人物整图或历史裁片，重试复用同一输出路径
          content:
            application/json:
              schema:
                type: object
                required: [success, images]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  images:
                    type: array
                    minItems: 1
                    maxItems: 9
                    items:
                      type: object
                      required: [view, url]
                      properties:
                        view:
                          type: string
                          enum: [sheet, face, front, side, threeQuarterLeft, threeQuarterRight, back, sideRight, upperBody, backThreeQuarter, left, right, reverse, frontWide, leftWide, rightWide, reverseLeft, reverseRight, detail]
                        url:
                          type: string
        '400':
          description: 参数或原图读取失败；读取失败包含 image_read_failed 错误码
        '422':
          description: 图像格式或尺寸无效
        '429':
          description: 裁切并发已满，可稍后处理原图
        '504':
          description: 裁切取消或超时，可继续处理原图
        '500':
          description: 裁切保存失败，可复用同一九宫格重试
