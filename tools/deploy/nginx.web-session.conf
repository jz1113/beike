# Included in the HTTPS server only.
auth_request /_beike_session;

location = /_beike_session {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:3000/_beike_session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
}

location = /_beike_login_page {
    internal;
    auth_request off;
    alias __REPO_DIR__/tools/deploy/login.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
}

location = /_beike_sign_in {
    auth_request off;
    auth_basic "Beike Cloud Graph";
    auth_basic_user_file /etc/nginx/.htpasswd;
    error_page 401 =403 /_beike_sign_in_denied;
    proxy_pass http://127.0.0.1:3000/;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
}

location = /_beike_sign_in_denied {
    internal;
    auth_request off;
    return 403;
}
