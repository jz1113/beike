<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录贝壳云图</title>
<style>
  body { color-scheme: dark; background: #18181b; color: #fafafa; font: 16px system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { width: min(360px, calc(100% - 64px)); padding: 24px; background: #232326; border-radius: 16px; }
  h1 { margin: 0 0 12px; font-size: 24px; }
  label { display: grid; gap: 6px; margin: 16px 0; }
  input, button { padding: 10px; border: 1px solid #666; border-radius: 8px; font: inherit; }
  button { width: 100%; cursor: pointer; }
  #status { color: #fda4af; min-height: 1.5em; }
</style>
<main>
  <h1>登录贝壳云图</h1>
  <p>使用原有网页账号访问创作空间。</p>
  <form id="login" method="post" action="/_beike_sign_in">
    <label>用户名 <input name="username" autocomplete="username" required autofocus></label>
    <label>密码 <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">登录</button>
    <p id="status" role="status"></p>
  </form>
</main>
<script>
  const form = document.querySelector('#login');
  const button = form.querySelector('button');
  const status = document.querySelector('#status');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    status.textContent = '';
    try {
      const fields = new FormData(form);
      const username = fields.get('username');
      if (username.includes(':')) {
        status.textContent = '用户名不能包含冒号。';
        return;
      }
      const bytes = new TextEncoder().encode(username + ':' + fields.get('password'));
      const authorization = btoa(Array.from(bytes, (byte) => String.fromCharCode(byte)).join(''));
      const response = await fetch('/_beike_sign_in', {
        method: 'POST',
        headers: { Authorization: 'Basic ' + authorization },
        cache: 'no-store',
      });
      if (response.ok) {
        location.reload();
      } else {
        status.textContent = response.status === 403 ? '用户名或密码错误。' : '登录服务暂不可用，请稍后重试。';
      }
    } catch {
      status.textContent = '无法连接登录服务，请稍后重试。';
    } finally {
      button.disabled = false;
    }
  });
</script>
</html>
